# Native Python on Render. The host builds with pip, so Docker is not required
# on your computer. The free instance disk is ephemeral and the service sleeps.
services:
  - type: web
    name: qpy-forge-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: sh scripts/serve.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: Q2PY_CORPUS
        value: corpus/cases.json
      - key: Q2PY_DB
        value: /tmp/q2py.sqlite
      - key: Q2PY_CORS_ORIGINS
        value: "*"
