[project]
name = "q2py-studio"
version = "0.1.0"
description = "Q2Py Forge translates supported Q/kdb+ expressions into Python and validates them against authored expectations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "polars>=1.9",
  "pydantic>=2.9",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.115",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.7",
]

[project.scripts]
q2py-score = "q2py.score:main"

[tool.vercel]
entrypoint = "app:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["q2py"]
warn_unused_ignores = true
namespace_packages = false

[[tool.mypy.overrides]]
module = ["polars", "polars.*"]
ignore_missing_imports = true
