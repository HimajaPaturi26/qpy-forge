# Fly.io API service. History lives at /data/q2py.sqlite and disappears with the
# machine unless you attach a volume and keep Q2PY_DB on that volume.
app = "qpy-forge-api"
primary_region = "iad"

[build]

[env]
  Q2PY_CORPUS = "/app/corpus/cases.json"
  Q2PY_DB = "/data/q2py.sqlite"

[http_service]
  internal_port = 43118
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
